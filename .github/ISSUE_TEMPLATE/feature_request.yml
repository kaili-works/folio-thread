name: Feature request / 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，而不是直接给方案；这样更容易判断是否值得做、以及有没有更简单的做法。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在的使用场景是什么？哪一步让你觉得别扭或做不到？
      placeholder: 例如：整理已有清单时，想按难度重新排序，但只能一本本上下移。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
      description: 描述期望的行为或交互；不必写实现细节。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选。现在是怎么绕过这个问题的？

  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      multiple: true
      options:
        - 登录 / 账户
        - 主题与清单
        - 今日阅读包
        - 阅读器
        - 听书 / 语音
        - 笔记
        - 统计
        - 书单市集
        - 书库 / EPUB 导入
        - 部署 / 数据库
        - 界面语言 / 排版
        - 其它

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复建议
          required: true
