name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check · build · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # 仅用于构建与「未登录」冒烟，不连接真实 Supabase：
      # 无 Cookie 请求在 requireUser 阶段即返回 401，不会发起数据库查询。
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      DEEPSEEK_API_KEY: ""
      WEREAD_API_KEY: ""
      EDGE_TTS_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          node node_modules/next/dist/bin/next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start within 40s"
          tail -n 50 /tmp/next.log
          exit 1

      - name: Smoke test
        run: node scripts/verify.mjs

      - name: Server log on failure
        if: failure()
        run: tail -n 100 /tmp/next.log

      - name: Stop server
        if: always()
        run: pkill -f "next start" || true
