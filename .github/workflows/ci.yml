name: CI

on:
  push:
    branches: [open-source]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check · build · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # 仅用于构建与「未登录」冒烟，不连接真实 Supabase：
      # 无 Cookie 请求在 requireUser 阶段即返回 401，不会发起数据库查询。
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      DEEPSEEK_API_KEY: ""
      WEREAD_API_KEY: ""
      EDGE_TTS_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          node node_modules/next/dist/bin/next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start within 40s"
          tail -n 50 /tmp/next.log
          exit 1

      - name: Smoke test
        run: node scripts/verify.mjs

      - name: Server log on failure
        if: failure()
        run: tail -n 100 /tmp/next.log

      - name: Stop server
        if: always()
        run: pkill -f "next start" || true

  docker:
    name: Docker build · health
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -t daily-reading:ci .

      - name: Run container
        run: |
          docker run -d --name app -p 3000:3000 \
            -e NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -e SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            daily-reading:ci

      - name: Health check
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "health check failed"
          docker logs app
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f app || true
